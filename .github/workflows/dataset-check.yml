name: dataset-check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install bundle
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Earth Engine auth
        run: |
          if [ -z "$EARTHENGINE_TOKEN" ]; then
            echo "::error::EARTHENGINE_TOKEN secret is not set"
            exit 1
          fi
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from apps._commons.dataset_check import _initialize_ee

          ee = _initialize_ee()
          assert ee.Number(1).add(1).getInfo() == 2
          print("Earth Engine ready")
          PY

      - name: Run dataset check
        id: check
        run: |
          set +e
          python -m apps._commons.dataset_check > report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "report<<EOF"
            cat report.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue (stale)
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "[dataset-check] staleness report";
            const body = `${{ steps.check.outputs.report }}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dataset-check",
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dataset-check"],
              });
            }

      - name: Close tracking issue (all green)
        if: steps.check.outputs.exit_code == '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "[dataset-check] staleness report";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dataset-check",
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

      - name: Fail step on staleness
        if: steps.check.outputs.exit_code != '0'
        run: exit ${{ steps.check.outputs.exit_code }}
