[supervisord]
nodaemon=true
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Served through asgi.py, not `solara run`: the tile route has to be listed
; before solara's catch-alls, which the CLI gives no way to do. settings.main.mode
; already defaults to production, so --production has no counterpart here.
[program:solara]
command=bash -c "SOLARA_APP=app.py micromamba run -n sepal-gee-bundle uvicorn asgi:app --host=0.0.0.0 --port=8768 --root-path=/api/app-launcher/sepal-gee-bundle"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:solara-dev]
command=bash -c "SOLARA_APP=app.py micromamba run -n sepal-gee-bundle uvicorn asgi:app --host=0.0.0.0 --port=8768"
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
