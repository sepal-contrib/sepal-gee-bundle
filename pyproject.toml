[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepal-gee-bundle"
version = "0.1.0"
description = "Bundle of lightweight GEE-based SEPAL applications: FCDM, Basin Rivers, GFC, Coverage Analysis"
requires-python = ">=3.12"
dependencies = [
    "pysepal>=3.6.1",
    "solara",
    "starlette<1.0",
    "ee-client>=2.5.0",
    "ipecharts",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=2.18.0",
    "commitizen",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "pypdf>=4",
]

[tool.setuptools.packages.find]
include = ["apps*", "pdf_report*"]

[tool.commitizen]
version = "0.1.0"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
version_files = [
    "pyproject.toml:version",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["."]

[tool.ruff]
fix = true
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "RUF"]
ignore = ["E501", "F403", "D107", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"
