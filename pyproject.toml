[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepal-gee-bundle"
version = "0.3.2"
description = "Bundle of lightweight GEE-based SEPAL applications: FCDM, Basin Rivers, GFC, Coverage Analysis"
requires-python = ">=3.12"
dependencies = [
    # Held on the 3.8 line while 4.0 is still a release candidate.
    "pysepal>=3.8.3,<4",
    # pysepal asserts solara.scope.get_kernel_id and solara._using_solara_server
    # at import; both are private, so solara stays pinned.
    "solara>=1.60,<2",
    "starlette<1.0",
    # anyio 4.15 made the top-level imports lazy (anyio#1169); solara reads
    # anyio.from_thread off a bare "import anyio" and dies at startup.
    "anyio<4.15",
    "ee-client>=3.1.0,<4",
    # 0.x: a minor is a breaking release, so cap it.
    "pysepal-api>=0.3.0,<0.4",
    "ipecharts",
    "vectortileserver>=0.2.1",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=2.18.0",
    "commitizen",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pyyaml",
    "ruff",
    "pypdf>=4",
]

[tool.setuptools.packages.find]
include = ["apps*", "pdf_report*"]

[tool.commitizen]
version = "0.3.2"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
version_files = [
    "pyproject.toml:version",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["."]

[tool.ruff]
fix = true
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "RUF"]
ignore = ["E501", "F403", "D107", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"
