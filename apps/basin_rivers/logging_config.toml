version = 1
disable_existing_loggers = false

[formatters.colored]
"()"   = "colorlog.ColoredFormatter"
format = "%(log_color)s%(asctime)s - \u001b[44m%(name)s\u001b[0m - %(levelname)s - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[formatters.colored.log_colors]
DEBUG    = "cyan"
INFO     = "green"
WARNING  = "yellow"
ERROR    = "red"
CRITICAL = "bold_red"

[handlers.console]
class     = "logging.StreamHandler"
level     = "DEBUG"
formatter = "colored"
stream    = "ext://sys.stderr"

[handlers.file]
class     = "logging.FileHandler"
level     = "DEBUG"
formatter = "colored"
filename  = "basin_rivers.log"
mode      = "w"

[loggers.sepal_gee_bundle.basin_rivers]
level     = "DEBUG"
handlers  = ["console", "file"]
propagate = false

[root]
level    = "WARNING"
handlers = []
